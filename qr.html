<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code Generator</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 16px;
    }
    @media (min-width: 600px) {
      body {
        padding: 40px;
      }
    }
    .container {
      background: white;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      min-height: 44px;
    }
    #qrcode {
      margin-top: 20px;
    }
    #qrcode img {
      max-width: 100%;
      height: auto;
      margin: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>QR Code Generator</h2>
  <input
    id="urlInput"
    type="text"
    aria-label="Text for QR code"
    placeholder="Enter a URL (https://...)"
  />
  <label for="sizeInput">Image size in pixels (1–4096)</label>
  <input id="sizeInput" type="number" min="1" max="4096" step="1" value="256" required />
  <button onclick="copyImage()">Copy Image</button>
  <p id="copyStatus" role="status"></p>

  <div id="qrcode"></div>
</div>

<!-- QRCode.js library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  async function copyImage() {
    const status = document.getElementById("copyStatus");
    const canvas = document.querySelector("#qrcode canvas");
    if (!canvas) {
      status.textContent = "Enter text and a valid image size to generate a QR code first.";
      return;
    }

    try {
      if (!navigator.clipboard?.write || typeof ClipboardItem === "undefined") {
        throw new Error("Image clipboard access is not available");
      }
      const image = new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("Could not create QR code image"));
          }
        }, "image/png");
      });
      await navigator.clipboard.write([new ClipboardItem({ "image/png": image })]);
      status.textContent = "Image copied.";
    } catch (error) {
      console.error("Could not copy QR code image:", error);
      status.textContent = "Could not copy image. Use HTTPS and check clipboard permissions, or press and hold the QR code to copy or save it.";
    }
  }

  function updateQR(url = document.getElementById("urlInput").value.trim()) {
    const qrContainer = document.getElementById("qrcode");
    const sizeInput = document.getElementById("sizeInput");

    document.getElementById("copyStatus").textContent = "";
    qrContainer.innerHTML = "";

    if (!sizeInput.validity.valid) {
      document.getElementById("copyStatus").textContent = "Enter a whole number between 1 and 4096 for the image size.";
      return;
    }

    if (!url) {
      return;
    }

    new QRCode(qrContainer, {
      text: url,
      width: sizeInput.valueAsNumber,
      height: sizeInput.valueAsNumber,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  }

  const urlInput = document.getElementById("urlInput");
  urlInput.value = new URLSearchParams(window.location.search).get("text") || "";
  urlInput.addEventListener("input", () => {
    const pageUrl = new URL(window.location.href);
    if (urlInput.value) {
      pageUrl.searchParams.set("text", urlInput.value);
    } else {
      pageUrl.searchParams.delete("text");
    }
    window.history.replaceState(null, "", pageUrl);
    updateQR();
  });
  document.getElementById("sizeInput").addEventListener("input", () => updateQR());
  updateQR();
</script>

</body>
</html>

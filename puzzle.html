<!DOCTYPE html>
<html lang="en">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Calendar Puzzle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        canvas {
            border: 2px solid #222;
            background: white;
            margin-bottom: 40px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            margin-top: 30px;
        }

        button {
            font-size: 20px;
        }

        #idStatus {
            margin-left: 10px;
            display: inline;
            margin-left: auto;
            margin-right: auto;
        }

        #idControls {
            align-items: center;
        }
    </style>
</head>

<body>
    <canvas id="canvas1" width="350" height="350"></canvas>
    <div id="idControls">
        <button id="idPrevButton">⏮</button>
        <button id="idPlayButton">▶</button>
        <button id="idPauseButton">⏸</button>
        <button id="idNextButton">⏭</button>
        <h2 id="idStatus"></h2>
    </div>

    <script type="module">
        "use strict";

        const COLORS = [
            "#ef4444",
            "#06b6d4",
            "#eab308",
            "#8b5cf6",
            "#3b82f6",
            "#10b981",
            "#f97316",
            "#64748b"
        ];

        const CELL_SIZE = 50;
        const GRID_SIZE = 8;

        function drawDate(canvasId, month, day) {
            const monthString = new Date(2000, month - 1, 1).toLocaleDateString('en-US', { month: 'short' });
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");

            ctx.strokeStyle = "#111827";
            ctx.fillStyle = "black";
            ctx.font = "bold 20px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            var col = (month - 1) % 6;
            var row = Math.floor((month - 1) / 6);

            var x = col * CELL_SIZE;
            var y = row * CELL_SIZE;

            ctx.fillText(
                monthString,
                x + CELL_SIZE / 2,
                y + CELL_SIZE / 2
            );

            col = (day - 1) % 7;
            row = Math.floor((day - 1) / 7) + 2;

            x = col * CELL_SIZE;
            y = row * CELL_SIZE;

            ctx.fillText(
                day,
                x + CELL_SIZE / 2,
                y + CELL_SIZE / 2
            );

        }

        function drawCell(ctx, row, col)
        {
            const y = row * CELL_SIZE;
            const x = col * CELL_SIZE;
            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
            ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
        }

        function drawCellByIndex(ctx, cellIndex)
        {
            const row = Math.floor(cellIndex / GRID_SIZE);
            const col = cellIndex % GRID_SIZE;
            drawCell(ctx, row, col);
        }


        function drawBoard(canvasId, pieces) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");

            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw empty grid
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#d1d5db";
            for (let row = 0; row < GRID_SIZE - 1; row++) {
                for (let col = 0; col < GRID_SIZE - 1; col++) {
                    drawCell(ctx, row, col);
                }
            }

            // Draw pieces
            ctx.strokeStyle = "#111827";
            ctx.lineWidth = 2;
            pieces.forEach((piece, pieceIndex) => {
                ctx.fillStyle = COLORS[pieceIndex];

                piece.forEach(cellIndex => {
                    drawCellByIndex(ctx, cellIndex);
                });
            });

            // draw cells outside of the board shape in black
            ctx.fillStyle = "black";
            ctx.strokeStyle = "#111827";
            ctx.lineWidth = 2;
            [6, 14, 51, 52, 53, 54].forEach(cellIndex => {
                drawCellByIndex(ctx, cellIndex);
            });
        }

        var sol = {};

        function drawBoard2() {
            drawBoard("canvas1", sol.solutions[sol.num]);
            drawDate("canvas1", sol.monthNum, sol.dayNum);
            document.getElementById("idStatus").textContent
                = (sol.num + 1) + " / " + sol.count;

        }

        function next() {
            sol.num++;
            if (sol.num >= sol.count) {
                sol.num = 0;
            }
            drawBoard2();
        }

        function prev() {
            if (sol.num <= 0) {
                sol.num = sol.count - 1;
            }
            else {
                sol.num--;
            }
            drawBoard2();
        }


        {
            const d = new Date();
            const month = d.getMonth() + 1;
            const day = d.getDate();
            const fname = "data/" + "solution_" + month + "_" + day + ".json";
            fetch(fname)
                .then(x => x.json())
                .then(ob => {
                    sol = ob;
                    sol.num = 0;
                    drawBoard2()
                })
                .catch(e => {
                    console.error(e);
                });
        }


        var interval;


        document.getElementById("idPrevButton").onclick = () => {
            clearInterval(interval);
            prev();
        };

        document.getElementById("idNextButton").onclick = () => {
            clearInterval(interval);
            next();
        };

        document.getElementById("idPlayButton").onclick = () => {
            next();
            clearInterval(interval);
            interval = setInterval(next, 200);
        };

        document.getElementById("idPauseButton").onclick = () => {
            clearInterval(interval);
        };

    </script>

</body>

</html>
